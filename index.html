<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5A1F">
<title>foundx – Build in public with young founders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FFF4E3;--card:#fff;--c2:#FBE8CC;--bd:rgba(26,22,18,.14);--cb:#1A1612;--ink:#1A1612;--tx:#1A1612;--mu:#6E6256;--a:#FF5A1F;--y:#FFC933;--g:#FF5A1F;--dot:rgba(26,22,18,.13)}
:root.dark{--bg:#14110E;--card:#1E1A16;--c2:#2A241E;--bd:rgba(246,238,226,.12);--cb:#3B332B;--ink:#0A0806;--tx:#F6EEE2;--mu:#A89C8C;--a:#FF6A2B;--g:#FF6A2B;--dot:rgba(246,238,226,.06)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg) radial-gradient(var(--dot) 1.2px,transparent 1.2px) 0 0/22px 22px;color:var(--tx);font:15px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo,.disp{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.card{background:var(--card);border:2px solid var(--cb);border-radius:16px;box-shadow:4px 4px 0 var(--cb);animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.btn{background:var(--a);color:#fff;font-weight:700;border:2px solid var(--ink);border-radius:12px;padding:.55rem 1.1rem;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}.btn:disabled{opacity:.5}
.ghost{border:2px solid var(--cb);border-radius:12px;padding:.45rem .85rem;font-weight:600;background:var(--card);transition:.12s}.ghost:hover{background:var(--y);color:#1A1612;border-color:var(--ink)}
.inp{width:100%;background:var(--card);border:2px solid var(--cb);border-radius:10px;padding:.65rem .85rem;color:inherit;font:inherit;outline:0;transition:.12s}
.inp:focus{border-color:var(--a);box-shadow:3px 3px 0 var(--a)}select.inp option{color:#000}
label.l{display:block;font-size:.78rem;color:var(--mu);margin:.9rem 0 .3rem;font-weight:700}
.chip{display:inline-flex;gap:.3rem;align-items:center;border:2px solid var(--cb);background:var(--card);border-radius:99px;padding:.22rem .8rem;font-size:.82rem;font-weight:600;white-space:nowrap;transition:.12s}
.chip:hover{background:var(--c2)}.chip.on{background:var(--a);color:#fff;border-color:var(--ink)}
.badge{font-size:.7rem;font-weight:700;padding:.08rem .5rem;border-radius:8px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none;border:2px solid var(--ink);font-family:'Bricolage Grotesque',sans-serif}
.avw{position:relative;display:inline-flex;flex:none}.dot{position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;min-width:9px;min-height:9px;border-radius:50%;border:2px solid var(--card)}
.logo{font-weight:800;font-size:1.6rem;letter-spacing:-.05em;color:var(--tx)}.logo::after{content:"x";display:inline-block;background:var(--a);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 .16em;margin-left:.1em;transform:rotate(-7deg);font-size:.85em;line-height:1.1}
.hl{background:linear-gradient(transparent 58%,var(--y) 58%)}
.stk{display:inline-block;background:var(--y);color:#1A1612;border:2px solid var(--ink);border-radius:10px;padding:.35rem .8rem;font-weight:700;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--ink)}
.shell{display:grid;grid-template-columns:230px minmax(0,640px) 300px;gap:22px;justify-content:center;padding:16px;max-width:1240px;margin:auto}
.shell>*,.chatwrap>*,.auth>*{min-width:0}.scroll{max-width:100%}
.side,.rp{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:14px}
.nav{display:flex;align-items:center;gap:.8rem;padding:.65rem 1rem;border-radius:12px;font-weight:600;width:100%;text-align:left;transition:.12s;color:var(--mu);border:2px solid transparent}
.nav:hover{background:var(--c2);color:var(--tx)}.nav.on{background:var(--y);color:#1A1612;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.tabbar{display:none}
.scroll{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0;scrollbar-width:none}
.bub{display:inline-block;padding:.45rem .85rem;border-radius:16px;max-width:80%;text-align:left;word-break:break-word;background:var(--c2);border:1.5px solid var(--cb)}
.me .bub{background:var(--a);color:#fff;border-color:var(--ink)}
.sk{height:120px;margin-top:14px;border-radius:16px;background:linear-gradient(90deg,var(--c2),transparent,var(--c2));background-size:200%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200%}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;border:2px solid var(--a);padding:.6rem 1.1rem;border-radius:12px;z-index:99;animation:up .3s}
.auth{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;max-width:1000px;margin:auto;min-height:100vh;align-items:center;padding:20px}
.bar{height:8px;border-radius:9px;background:var(--c2);border:1.5px solid var(--cb);overflow:hidden}.bar i{display:block;height:100%;background:var(--a);transition:.4s}
.chatwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;height:calc(100vh - 120px);min-height:420px}
.cp{display:flex;flex-direction:column;overflow:hidden}.cl{overflow-y:auto;padding:12px}
.step{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--mu);font-weight:600}
@keyframes pg{from{width:0}to{width:100%}}
.mtop{display:none}.back{display:none}html,body{overflow-x:hidden}img{max-width:100%}.mlogo{display:none}
@media(max-width:1100px){.shell{grid-template-columns:230px minmax(0,1fr)}.rp{display:none}}
@media(max-width:760px){.shell{grid-template-columns:minmax(0,1fr);padding:8px 10px 96px}.side{display:none}.card{box-shadow:3px 3px 0 var(--cb)}
.mtop{display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:15;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--bg);border-bottom:2px solid var(--cb);font-size:1.25rem}
.tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--cb)}
.tabbar button{display:flex;flex-direction:column;align-items:center;font-size:.68rem;font-weight:600;color:var(--mu);gap:2px}.tabbar button.on{color:var(--a);font-weight:800}.tabbar span{font-size:1.3rem}
.auth{grid-template-columns:minmax(0,1fr);padding:14px;min-height:100dvh}.hero{display:none}.mlogo{display:block}
.chatwrap{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 210px);min-height:360px}.chatwrap .cp{display:none}.chatwrap.open .cp{display:flex}.chatwrap.open .cl{display:none}.back{display:inline-flex!important}
.inp,select.inp,textarea.inp{font-size:16px}.ghost,.chip{min-height:36px}.btn{min-height:42px}
.toast{width:max-content;max-width:92vw;text-align:center}.bub{max-width:100%}}
</style></head>
<body><div id="app"></div>
<script type="module" src="app.js?v=5"></script></body></html>
