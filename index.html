<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoundX – Young Entrepreneurs Community</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
:root{--bg:#f4f4fb;--card:rgba(255,255,255,.85);--bd:rgba(0,0,0,.1);--tx:#14141f}
:root.dark{--bg:#0b0b14;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#eef}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;min-height:100vh}
.g{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);border-radius:16px}
.btn{background:linear-gradient(90deg,#8b5cf6,#06b6d4);color:#fff;border-radius:12px;padding:.5rem 1rem;font-weight:600}
.in{width:100%;background:transparent;border:1px solid var(--bd);border-radius:10px;padding:.55rem .7rem;color:inherit}
.in option{color:#000}
.chip{border:1px solid var(--bd);border-radius:999px;padding:.2rem .7rem;font-size:.8rem;cursor:pointer}
.on{background:#8b5cf6;color:#fff;border-color:#8b5cf6}
</style></head>
<body><div id="app" class="max-w-3xl mx-auto p-3"></div>
<script type="module" src="app.js"></script></body></html>
