<!DOCTYPE html>
<html lang="en" class="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080812">
<title>FoundX – Build in public with young founders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f6f6fb;--card:#fff;--c2:#eeeef7;--bd:rgba(20,20,40,.09);--tx:#15152a;--mu:#6b6b85;--a:#8b5cf6;--b:#06b6d4;--g:linear-gradient(135deg,#8b5cf6,#06b6d4)}
:root.dark{--bg:#080812;--card:rgba(255,255,255,.055);--c2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.09);--tx:#f1f1ff;--mu:#9a9ab5}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% -5%,rgba(139,92,246,.28),transparent),radial-gradient(500px 400px at 100% 20%,rgba(6,182,212,.2),transparent),radial-gradient(500px 400px at 40% 110%,rgba(16,185,129,.14),transparent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(16px);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.btn{background:var(--g);color:#fff;font-weight:600;border-radius:12px;padding:.6rem 1.1rem;transition:.2s;box-shadow:0 6px 20px -8px #8b5cf6}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn:disabled{opacity:.5}
.ghost{border:1px solid var(--bd);border-radius:12px;padding:.5rem .9rem;font-weight:500;transition:.2s}.ghost:hover{background:var(--c2)}
.inp{width:100%;background:var(--c2);border:1px solid transparent;border-radius:12px;padding:.7rem .9rem;color:inherit;font:inherit;outline:0;transition:.2s}
.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(139,92,246,.2)}select.inp option{color:#000}
label.l{display:block;font-size:.78rem;color:var(--mu);margin:.9rem 0 .3rem;font-weight:500}
.chip{display:inline-flex;gap:.3rem;align-items:center;border:1px solid var(--bd);border-radius:99px;padding:.3rem .8rem;font-size:.82rem;white-space:nowrap;transition:.2s}
.chip:hover{background:var(--c2)}.chip.on{background:var(--g);color:#fff;border-color:transparent}
.badge{font-size:.7rem;font-weight:600;padding:.12rem .55rem;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
.shell{display:grid;grid-template-columns:230px minmax(0,640px) 300px;gap:20px;justify-content:center;padding:16px;max-width:1240px;margin:auto}
.side,.rp{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:14px}
.nav{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;border-radius:14px;font-weight:500;width:100%;text-align:left;transition:.2s;color:var(--mu)}
.nav:hover{background:var(--c2);color:var(--tx)}.nav.on{background:var(--c2);color:var(--tx);font-weight:700}
.tabbar{display:none}
.logo{font-weight:800;font-size:1.5rem;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.scroll{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0;scrollbar-width:none}
.like.p{animation:pop .35s}@keyframes pop{50%{transform:scale(1.4)}}
.bub{display:inline-block;padding:.45rem .85rem;border-radius:18px;max-width:80%;text-align:left;word-break:break-word;background:var(--c2)}
.me .bub{background:var(--g);color:#fff}
.sk{height:120px;margin-top:14px;border-radius:20px;background:linear-gradient(90deg,var(--c2),transparent,var(--c2));background-size:200%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200%}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:.6rem 1.1rem;border-radius:12px;z-index:99;animation:up .3s}
.auth{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;max-width:1000px;margin:auto;min-height:100vh;align-items:center;padding:20px}
.bar{height:5px;border-radius:9px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:.4s}
.chatwrap{display:grid;grid-template-columns:230px 1fr;gap:14px;height:calc(100vh - 120px);min-height:420px}
.cp{display:flex;flex-direction:column;overflow:hidden}.cl{overflow-y:auto;padding:12px}
.step{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--mu)}.step b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c2)}.step.d b{background:var(--g);color:#fff}
@media(max-width:1100px){.shell{grid-template-columns:230px minmax(0,1fr)}.rp{display:none}}
@media(max-width:760px){.shell{grid-template-columns:minmax(0,1fr);padding:10px 10px 90px}.side{display:none}
.tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);backdrop-filter:blur(16px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;font-size:.68rem;color:var(--mu);gap:2px}.tabbar button.on{color:var(--a);font-weight:700}.tabbar span{font-size:1.3rem}
.auth{grid-template-columns:minmax(0,1fr)}.hero{display:none}
.chatwrap{grid-template-columns:minmax(0,1fr);height:calc(100vh - 160px)}.chatwrap .cp{display:none}.chatwrap.open .cp{display:flex}.chatwrap.open .cl{display:none}.back{display:inline-flex!important}}
.back{display:none}.avw{position:relative;display:inline-flex;flex:none}.dot{position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;min-width:9px;min-height:9px;border-radius:50%;border:2px solid var(--bg)}@keyframes pg{from{width:0}to{width:100%}}.mlogo{display:none}@media(max-width:760px){.mlogo{display:block}}
.shell>*,.chatwrap>*,.auth>*{min-width:0}.scroll{max-width:100%}.shell{max-width:100vw}
.mtop{display:none}html,body{overflow-x:hidden}img{max-width:100%}
@media(max-width:760px){
.mtop{display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:15;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--bg);border-bottom:1px solid var(--bd);font-size:1.25rem}
.inp,select.inp,textarea.inp{font-size:16px}
.ghost,.chip{min-height:36px}.btn{min-height:42px}
.shell{padding:8px 10px 96px}.card{border-radius:16px}
.chatwrap{height:calc(100dvh - 210px);min-height:360px}
.auth{padding:14px;min-height:100dvh}
.toast{width:max-content;max-width:92vw;text-align:center}
.bub{max-width:100%}}
</style></head>
<body><div id="app"></div>
<script type="module" src="app.js?v=3"></script></body></html>
